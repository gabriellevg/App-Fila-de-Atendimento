<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Fila de Atendimento{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header class="topo">
    <div class="container">
        <h1>Fila de Atendimento</h1>
        <p>Gerenciamento de fila por ordem de chegada</p>
    </div>
</header>

<main class="container">

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            <div class="mensagens">
                {% for categoria, mensagem in mensagens %}
                    <div class="alerta {{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

</body>
</html>
